<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Pest Control Services Jacksonville logo</title>
  <desc id="desc">A green shield containing a home and a crossed-out pest symbol, alongside the Pest Control Services Jacksonville wordmark.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#278552"/>
      <stop offset="1" stop-color="#1f6f43"/>
    </linearGradient>
  </defs>
  <!-- Protection badge -->
  <path d="M166 22 278 63v76c0 76-45 126-112 160-67-34-112-84-112-160V63z" fill="url(#shield)"/>
  <path d="M166 42 260 76v63c0 61-34 103-94 135-60-32-94-74-94-135V76z" fill="none" stroke="#fff" stroke-opacity=".24" stroke-width="3"/>
  <!-- Home -->
  <path d="m102 145 64-51 64 51" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M117 140v64c0 5 4 9 9 9h80c5 0 9-4 9-9v-64" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M153 213v-43c0-7 6-13 13-13s13 6 13 13v43" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <!-- Small pest mark, crossed out -->
  <circle cx="221" cy="111" r="24" fill="#fff"/>
  <circle cx="221" cy="107" r="5" fill="#1f6f43"/>
  <ellipse cx="221" cy="117" rx="4" ry="6" fill="#1f6f43"/>
  <path d="m213 108-6-5m22 5 6-5m-22 14-7 2m22-2 7 2m-17-20-3-5m7 5 3-5" fill="none" stroke="#1f6f43" stroke-width="2.5" stroke-linecap="round"/>
  <path d="m205 127 32-32" stroke="#1f6f43" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Wordmark -->
  <text x="340" y="135" fill="#18231d" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="1">PEST CONTROL</text>
  <text x="343" y="205" fill="#1f6f43" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="7">SERVICES</text>
  <path d="M344 229h126" stroke="#1f6f43" stroke-width="4" stroke-linecap="round"/>
  <text x="493" y="246" fill="#43534a" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" letter-spacing="7">JACKSONVILLE</text>
</svg>
